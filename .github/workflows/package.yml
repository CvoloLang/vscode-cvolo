name: Package VSIX

# Builds the platform-specific VSIX artifacts for the Cvolo VS Code extension.
# This workflow performs NO Marketplace publishing and uses NO Marketplace
# credentials. It is the deterministic packaging contract: each leg stages the
# exact official Language Server bundle for one RID and packages one VSIX.
on:
  workflow_dispatch:
    inputs:
      languageServerVersion:
        description: Optional official Language Server version (must match the repository pin)
        required: false

  # workflow_dispatch only registers once this file exists on the default branch
  # (main), which Stage 10 must not touch. Until then, run the same packaging
  # contract from develop/0.1.0 whenever a packaging input changes.
  push:
    branches:
      - develop/0.1.0
    paths:
      - '.github/workflows/package.yml'
      - '.github/language-server-release.json'
      - 'package.json'
      - 'package-lock.json'
      - 'extension.js'
      - 'extension-runtime.js'
      - 'editor-intelligence.js'
      - 'editor-intelligence-runtime.js'
      - 'brace-colorizer.js'
      - 'brace-colorizer-runtime.js'
      - 'syntax-colorizer.js'
      - 'syntax-colorizer-runtime.js'
      - 'server-platform.js'
      - 'scripts/**'
      - 'test/**'
      - '.vscodeignore'
      - 'images/**'
      - 'syntaxes/**'
      - 'themes/**'
      - 'language-configuration.json'
      - 'LICENSE'
      - 'README.md'
      - 'server/README.md'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            rid: win-x64
          - target: linux-x64
            rid: linux-x64
          - target: linux-arm64
            rid: linux-arm64
          - target: darwin-x64
            rid: osx-x64
          - target: darwin-arm64
            rid: osx-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve pinned Language Server
        env:
          REQUESTED_LSP_VERSION: ${{ inputs.languageServerVersion }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pin = require('./.github/language-server-release.json');
          const requested = process.env.REQUESTED_LSP_VERSION;
          if (requested && requested !== pin.languageServerVersion) {
            throw new Error('Requested Language Server version must match .github/language-server-release.json');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `LSP_VERSION=${pin.languageServerVersion}`,
            `LSP_COMMIT=${pin.languageServerCommit}`,
            `LSP_TOOLING=${pin.toolingVersion}`,
            `LSP_COMPILER=${pin.compilerCompatibilityLine}`,
            ''
          ].join('\n'));
          NODE

      - name: Static checks (no bundle)
        run: npm run check

      - name: Stage the official Language Server bundle
        run: |
          node scripts/stage-server.js \
            --lsp-version "${LSP_VERSION}" \
            --rid ${{ matrix.rid }} \
            --expect-commit "${LSP_COMMIT}" \
            --expect-tooling-version "${LSP_TOOLING}" \
            --expect-compiler-line "${LSP_COMPILER}"

      - name: Validate the staged bundle
        run: npm run check

      - name: Package the VSIX (pre-release)
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npx --yes @vscode/vsce package \
            --target ${{ matrix.target }} \
            --pre-release \
            --out "cvolo-language-${version}-${{ matrix.target }}.vsix"
          echo "VSIX_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Inspect the VSIX contents
        run: |
          set -euo pipefail
          vsix="cvolo-language-${VSIX_VERSION}-${{ matrix.target }}.vsix"
          echo "== $vsix =="
          unzip -l "$vsix"
          # The VSIX must contain exactly one server RID directory, and it must be
          # the one this leg staged.
          staged="$(unzip -Z1 "$vsix" | grep -E '^extension/server/[^/]+/' | cut -d/ -f3 | sort -u | tr '\n' ' ')"
          echo "staged server RIDs in VSIX: ${staged}"
          test "${staged}" = "${{ matrix.rid }} " || { echo "VSIX must contain exactly server/${{ matrix.rid }}/" >&2; exit 1; }
          unzip -p "$vsix" "extension/server/${{ matrix.rid }}/bundle-manifest.json" > /dev/null
          echo "bundle-manifest.json present for ${{ matrix.rid }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvolo-language-${{ matrix.target }}
          path: cvolo-language-*-${{ matrix.target }}.vsix
          if-no-files-found: error
